# GitHub Releases 自动发布
# 触发：推送 v* tag（pnpm release:tag 创建），或手动 workflow_dispatch
# 产物：macOS dmg+zip（arm64+x64）/ Windows NSIS（x64）/ Linux AppImage+deb（x64）
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      note:
        description: '发布说明备注（可选）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --mac
            name: macOS (dmg + zip, arm64+x64)
          - platform: windows-latest
            args: --win
            name: Windows (NSIS x64)
          - platform: ubuntu-latest
            args: --linux
            name: Linux (AppImage + deb)
    runs-on: ${{ matrix.platform }}
    # secrets 不允许出现在步骤级 if 中：先在 job 级 env 捕获（env 可用于步骤 if）
    env:
      HAS_APPLE_SECRET: ${{ secrets.APPLE_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm 版本自动读取 package.json 的 packageManager 字段（pnpm@10.34.5）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Core smoke (CI 无 DSH_HOME 场景)
        run: DSH_HOME="$RUNNER_TEMP/dsh-empty-home" pnpm core:smoke
        shell: bash

      - name: Build
        run: pnpm build

      # macOS：配置了签名/公证 secrets 时启用签名+公证，否则无签名回退
      - name: Package and publish (macOS signed & notarized)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_SECRET == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          USE_HARD_LINKS: 'false'
        run: npx electron-builder --mac --publish always

      - name: Package and publish (macOS unsigned fallback)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_SECRET != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          USE_HARD_LINKS: 'false'
        run: npx electron-builder --mac --publish always

      # Windows / Linux
      - name: Package and publish (Windows / Linux)
        if: matrix.platform != 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          USE_HARD_LINKS: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish always

      - name: Upload artifacts (workflow 侧备份)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
          retention-days: 30
