# electron-builder 打包配置
# 构建：pnpm dist            （当前平台）
#       pnpm dist:mac        （macOS：dmg + zip，arm64 + x64）
#       pnpm dist:win        （Windows：NSIS，x64；需 Windows 或 wine）
#       pnpm dist:linux      （Linux：AppImage + deb）
appId: com.dshmanager.app
productName: DSH Manager
copyright: Copyright © 2026 dsh-manager

directories:
  output: dist
  buildResources: build

# electron-vite 产物在 out/，asar 打包
files:
  - out/**
  - package.json

asar: true

# 无原生依赖，禁止重编译
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 无签名证书：跳过 codesign（分发前接入开发者证书后删除此行）
  identity: null

dmg:
  title: DSH Manager
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DSH Manager

linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
    - target: deb
      arch: [x64, arm64]

# 发布到 GitHub Releases（CI 用 GH_TOKEN；owner/repo 从 git remote 自动识别）
# 本地调试可加 --publish never
publish:
  provider: github
  releaseType: release
